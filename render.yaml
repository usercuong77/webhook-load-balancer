services:
  - type: web
    name: bot-webhook-load-balancer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT main:app
    envVars:
      - key: PORT
        value: "10000"
      - key: REQUEST_TIMEOUT_SEC
        value: "25"
      - key: UID_CHECKER_ENABLED
        value: "1"
      - key: UID_CHECKER_API_KEY
        sync: false
      - key: UID_CHECKER_TIMEOUT
        value: "10"
      - key: LATEST_POST_TOTAL_TIMEOUT
        value: "15"
      - key: LIVE_CHECK_CONCURRENCY
        value: "10"
      - key: CHECKER_CACHE_ENABLED
        value: "1"
      - key: CHECKER_CACHE_MAX_ITEMS
        value: "2000"
      - key: CHECKER_GET_UID_CACHE_TTL_SEC
        value: "21600"
      - key: CHECKER_CHECK_CACHE_TTL_SEC
        value: "45"
      - key: CHECKER_LATEST_POST_CACHE_TTL_SEC
        value: "55"
      - key: CHECKER_BATCH_MAX_ITEMS
        value: "25"
      - key: PRIMARY_SCRIPT_URL
        sync: false
      - key: SCRIPT_BACKEND_URLS
        sync: false
      - key: TELEGRAM_SCRIPT_URLS
        sync: false
      - key: LEAD_SCRIPT_URLS
        sync: false
      - key: SEPAY_SCRIPT_URLS
        sync: false
      - key: SEPAY_FAILOVER_ENABLED
        value: "0"
      - key: WEBHOOK_SHARED_SECRET
        sync: false
      - key: TELEGRAM_ASYNC_ENABLED
        value: "1"
      - key: TELEGRAM_ASYNC_WORKERS
        value: "8"
      - key: TELEGRAM_FAILOVER_STRATEGY
        value: "priority"
      - key: TELEGRAM_LOADING_ENABLED
        value: "1"
      - key: TELEGRAM_LOADING_TEXT
        value: "Đang chạy..."
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN_MAP
        sync: false
      - key: TELEGRAM_HEAVY_QUEUE_ENABLED
        value: "1"
      - key: TELEGRAM_HEAVY_QUEUE_WORKERS
        value: "2"
      - key: TELEGRAM_HEAVY_QUEUE_MAX_SIZE
        value: "200"
      - key: TELEGRAM_HEAVY_QUEUE_NON_COMMANDS
        value: "1"
      - key: TELEGRAM_HEAVY_COMMANDS
        value: "/check,/checkpost,/viplike,/viplikeoff,/lammoiviplike,/lamoi,/refreshviplike,/capnhatmenu,/accgg"
      - key: TELEGRAM_DURABLE_QUEUE_ENABLED
        value: "1"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TELEGRAM_DURABLE_QUEUE_KEY
        value: "bot:telegram:heavy:queue"
      - key: TELEGRAM_DURABLE_PROCESSING_KEY
        value: "bot:telegram:heavy:processing"
      - key: TELEGRAM_DURABLE_QUEUE_TIMEOUT_SEC
        value: "8"
      - key: TELEGRAM_DURABLE_QUEUE_IDLE_SEC
        value: "2"
      - key: TELEGRAM_DURABLE_QUEUE_RECOVER_ON_STARTUP
        value: "1"
      - key: TELEGRAM_DURABLE_QUEUE_RECOVER_LIMIT
        value: "100"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_HEADERS
        sync: false
