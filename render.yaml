services:
  - type: web
    name: bot-webhook-load-balancer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT main:app
    envVars:
      - key: PORT
        value: "10000"
      - key: REQUEST_TIMEOUT_SEC
        value: "25"
      - key: PRIMARY_SCRIPT_URL
        sync: false
      - key: SCRIPT_BACKEND_URLS
        sync: false
      - key: TELEGRAM_SCRIPT_URLS
        sync: false
      - key: LEAD_SCRIPT_URLS
        sync: false
      - key: SEPAY_SCRIPT_URLS
        sync: false
      - key: SEPAY_FAILOVER_ENABLED
        value: "0"
      - key: WEBHOOK_SHARED_SECRET
        sync: false
      - key: TELEGRAM_ASYNC_ENABLED
        value: "1"
      - key: TELEGRAM_ASYNC_WORKERS
        value: "8"
      - key: TELEGRAM_FAILOVER_STRATEGY
        value: "priority"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_HEADERS
        sync: false
